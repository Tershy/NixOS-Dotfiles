[mgr]
show_hidden = true
sort_dir_first = true
wrap = "yes"
cursor_blink = true

[opener]
edit = [
    { run = 'nvim "$@"', block = true, desc = "Edit with nvim" },
]

[open]
prepend_rules = [
    { mime = "text/*", use = "edit" },
    { url = "*.conf", use = "edit" },
    { url = "*.toml", use = "edit" },
    { url = "*.nix", use = "edit" },
    { url = "*.lua", use = "edit "},
]
